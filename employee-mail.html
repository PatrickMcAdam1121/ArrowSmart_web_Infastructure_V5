<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mail — ArrowSmart Employee Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"/>
  <style>
    body { font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* email body prose */
    .email-body { line-height: 1.75; color: #CBD5E1; font-size: 0.875rem; }
    .email-body p { margin-bottom: 1em; }
    .email-body .sig { color: #475569; font-size: 0.8rem; border-top: 1px solid #1E293B; margin-top: 1.5em; padding-top: 1em; }
    .email-body .label { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.75em; }
    .email-body .label.ts   { background: rgba(239,68,68,0.12); color: #F87171; border: 1px solid rgba(239,68,68,0.25); }
    .email-body .label.conf { background: rgba(245,158,11,0.12); color: #FCD34D; border: 1px solid rgba(245,158,11,0.25); }
    .email-body .label.ob   { background: rgba(236,72,153,0.12); color: #F472B6; border: 1px solid rgba(236,72,153,0.25); }
    .email-body .label.apex { background: rgba(255,176,0,0.12);  color: #FFB000; border: 1px solid rgba(255,176,0,0.3); }
    .email-body .label.std  { background: rgba(16,185,129,0.1);  color: #34D399; border: 1px solid rgba(16,185,129,0.2); }
    .email-body blockquote { border-left: 2px solid #334155; padding-left: 1em; color: #475569; font-size: 0.8rem; margin: 0.75em 0; }
    .email-body .att  { display:inline-flex;align-items:center;gap:6px;background:#0B1120;border:1px solid #334155;border-radius:6px;padding:5px 10px;font-size:0.72rem;color:#94A3B8;margin-top:4px; }

    /* mail list item */
    .mail-item { border-bottom: 1px solid #1E293B; cursor: pointer; transition: background 0.12s; }
    .mail-item:hover { background: #141D2E; }
    .mail-item.active { background: #0F2A1E; border-left: 2px solid #10B981; }
    .mail-item.unread .mail-subject { color: #fff; font-weight: 600; }
    .mail-item .mail-subject { color: #94A3B8; font-weight: 400; }
    .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: #10B981; flex-shrink: 0; }

    /* classified badge colours */
    .badge-ts   { background:rgba(239,68,68,0.12);color:#F87171;border-color:rgba(239,68,68,0.25); }
    .badge-conf { background:rgba(245,158,11,0.12);color:#FCD34D;border-color:rgba(245,158,11,0.25); }
    .badge-ob   { background:rgba(236,72,153,0.12);color:#F472B6;border-color:rgba(236,72,153,0.25); }
    .badge-apex { background:rgba(255,176,0,0.12);color:#FFB000;border-color:rgba(255,176,0,0.3); }
    .badge-std  { background:rgba(16,185,129,0.08);color:#34D399;border-color:rgba(16,185,129,0.2); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.15s ease forwards; }
  </style>
</head>
<body class="bg-[#0B1120] text-white">

<!-- TOP BAR -->
<header class="shrink-0 w-full border-b border-[#334155] bg-[#0B1120]/95 backdrop-blur-md z-50">
  <div class="h-14 flex items-center px-4 gap-4">
    <a href="employee-portal.html" class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded bg-[#10B981]/10 flex items-center justify-center text-[#10B981]">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L4 4 L20 4"/></svg>
      </div>
      <span class="text-sm font-bold text-white hidden sm:block">ArrowSmart</span>
    </a>
    <span class="text-[#334155]">|</span>
    <span id="clearance-badge" class="text-[10px] font-bold uppercase tracking-widest text-[#10B981] border border-[#10B981]/20 bg-[#10B981]/5 rounded px-2 py-0.5 shrink-0">LEVEL — CLEARANCE</span>

    <!-- search -->
    <div class="flex-1 max-w-md relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-[#475569]" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Search mail…" oninput="renderList()" class="w-full bg-[#1E293B] border border-[#334155] rounded-lg pl-8 pr-4 py-1.5 text-xs text-white placeholder-[#475569] focus:outline-none focus:border-[#10B981] transition-colors"/>
    </div>

    <div class="flex items-center gap-3 ml-auto">
      <span class="text-[#94A3B8] text-xs hidden sm:block" id="emp-name-display"></span>
      <a href="employee-login.html" onclick="sessionStorage.removeItem('as_employee')" class="text-xs text-[#475569] hover:text-red-400 border border-[#334155] px-2.5 py-1.5 rounded transition-colors">Sign Out</a>
    </div>
  </div>
</header>

<!-- MAIN 3-PANE LAYOUT -->
<div class="flex flex-1 min-h-0 overflow-hidden">

  <!-- SIDEBAR / FOLDERS -->
  <aside class="w-48 shrink-0 border-r border-[#334155] flex flex-col py-3 overflow-y-auto bg-[#080F1C]">
    <div class="px-3 mb-3">
      <button class="w-full px-3 py-2 rounded-lg bg-[#10B981] hover:bg-[#059669] text-white text-xs font-semibold transition-colors" onclick="alert('Compose is disabled on this portal. Use internal messaging through your department head.')">+ Compose</button>
    </div>

    <p class="px-3 text-[10px] font-bold uppercase tracking-widest text-[#334155] mb-1">Folders</p>
    <button onclick="setFolder('inbox',this)" id="f-inbox" class="folder-btn flex items-center justify-between px-3 py-2 text-xs text-white bg-[#10B981]/10 hover:bg-[#1E293B] transition-colors rounded-lg mx-2 mb-0.5">
      <span class="flex items-center gap-2"><span class="text-[#10B981]">✉</span> Inbox</span>
      <span id="inbox-count" class="text-[10px] bg-[#10B981] text-black rounded-full px-1.5 font-bold">0</span>
    </button>
    <button onclick="setFolder('flagged',this)" id="f-flagged" class="folder-btn flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2 mb-0.5">
      <span class="text-amber-400">⚑</span> Flagged
    </button>
    <button onclick="setFolder('classified',this)" id="f-classified" class="folder-btn flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2 mb-0.5">
      <span class="text-red-400">⬡</span> Classified
    </button>
    <button onclick="setFolder('sent',this)" id="f-sent" class="folder-btn flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2 mb-0.5">
      <span class="text-[#475569]">↗</span> Sent
    </button>
    <button onclick="setFolder('system',this)" id="f-system" class="folder-btn flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2">
      <span class="text-[#475569]">⚙</span> System
    </button>

    <hr class="border-[#1E293B] mx-3 my-3"/>

    <p class="px-3 text-[10px] font-bold uppercase tracking-widest text-[#334155] mb-1">Portal</p>
    <a href="employee-portal.html" class="flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2 mb-0.5">← Dashboard</a>
    <a href="archive.html"         class="flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2 mb-0.5">◈ Archive</a>
    <a href="transmission-log.html" class="flex items-center gap-2 px-3 py-2 text-xs text-[#94A3B8] hover:text-white hover:bg-[#1E293B] transition-colors rounded-lg mx-2">⌖ Transmission Log</a>
  </aside>

  <!-- EMAIL LIST -->
  <div class="w-72 shrink-0 border-r border-[#334155] flex flex-col overflow-hidden bg-[#0A1120]">
    <div class="px-4 py-3 border-b border-[#1E293B] flex items-center justify-between shrink-0">
      <h2 class="text-sm font-bold text-white" id="folder-title">Inbox</h2>
      <span class="text-xs text-[#475569]" id="list-count">0 messages</span>
    </div>
    <div id="email-list" class="flex-1 overflow-y-auto"></div>
  </div>

  <!-- READING PANE -->
  <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
    <!-- empty state -->
    <div id="reading-empty" class="flex-1 flex flex-col items-center justify-center gap-3 text-center p-8">
      <div class="text-4xl text-[#1E293B]">✉</div>
      <p class="text-[#334155] text-sm">Select a message to read it</p>
    </div>

    <!-- message pane -->
    <div id="reading-pane" style="display:none" class="flex-1 flex flex-col overflow-hidden">
      <!-- message header -->
      <div class="shrink-0 px-8 py-5 border-b border-[#1E293B] bg-[#080F1C]">
        <div class="flex items-start justify-between gap-4 mb-3">
          <h3 class="text-lg font-bold text-white leading-tight" id="r-subject"></h3>
          <span id="r-badge" class="text-[10px] px-2 py-0.5 rounded border font-bold mono shrink-0 mt-0.5"></span>
        </div>
        <div class="flex flex-wrap gap-x-6 gap-y-1 text-xs text-[#94A3B8]">
          <span><span class="text-[#475569]">From: </span><span class="text-white" id="r-from"></span></span>
          <span><span class="text-[#475569]">To: </span><span id="r-to"></span></span>
          <span><span class="text-[#475569]">Date: </span><span id="r-date"></span></span>
        </div>
        <div id="r-tags" class="flex flex-wrap gap-1.5 mt-2"></div>
      </div>

      <!-- message body -->
      <div class="flex-1 overflow-y-auto px-8 py-6 fade-in">
        <div id="r-body" class="email-body max-w-2xl"></div>
      </div>
    </div>
  </div>

</div>

<script>
/* ── AUTH ─────────────────────────────────────────────────── */
let currentUser = null;
(function(){
  const emp = JSON.parse(sessionStorage.getItem('as_employee')||'null');
  if (!emp){ window.location.href='employee-login.html'; return; }
  currentUser = emp;
  document.getElementById('emp-name-display').textContent = emp.name;
  document.getElementById('clearance-badge').textContent = 'LEVEL '+emp.level+' CLEARANCE';
})();

/* ── EMAILS ───────────────────────────────────────────────── */
const EMAILS = [

  /* ═══════════════════════ LEVEL 1 — ALL STAFF ═══════════════════════ */

  {

  /* ═══════════════════════ LEVEL 2 ═══════════════════════════════════ */

  {

  /* ═══════════════════════ LEVEL 5 ═══════════════════════════════════ */

/* ── STATE ─────────────────────────────────────────────────── */
let currentFolder = 'inbox';
let selectedId    = null;
const readIds     = new Set(JSON.parse(localStorage.getItem('as_mail_read') || '[]'));

function markRead(id) {
  readIds.add(id);
  localStorage.setItem('as_mail_read', JSON.stringify([...readIds]));
}

/* ── FOLDER ─────────────────────────────────────────────────── */
function setFolder(f, btn) {
  currentFolder = f;
  document.querySelectorAll('.folder-btn').forEach(b => {
    b.classList.remove('text-white', 'bg-[#10B981]/10');
    b.classList.add('text-[#94A3B8]');
  });
  btn.classList.remove('text-[#94A3B8]');
  btn.classList.add('text-white', 'bg-[#10B981]/10');
  const titles = { inbox:'Inbox', flagged:'Flagged', classified:'Classified', sent:'Sent', system:'System' };
  document.getElementById('folder-title').textContent = titles[f] || f;
  selectedId = null;
  document.getElementById('reading-empty').style.display = '';
  document.getElementById('reading-pane').style.display = 'none';
  renderList();
}

/* ── FILTER ──────────────────────────────────────────────────── */
function getVisible() {
  const q = (document.getElementById('search-input').value || '').toLowerCase();
  return EMAILS.filter(e => {
    if (!currentUser || currentUser.level < e.minLevel) return false;
    if (currentFolder === 'flagged') { if (!e.flagged) return false; }
    else if (e.folder !== currentFolder) return false;
    if (q && !e.subject.toLowerCase().includes(q) && !e.from.toLowerCase().includes(q) && !(e.tags||[]).some(t=>t.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date));
}

/* ── RENDER LIST ─────────────────────────────────────────────── */
function renderList() {
  const items = getVisible();
  const list = document.getElementById('email-list');
  document.getElementById('list-count').textContent = items.length + ' message' + (items.length===1?'':'s');

  if (items.length === 0) {
    list.innerHTML = '<div class="p-6 text-center text-[#334155] text-xs">No messages.</div>';
    return;
  }

  list.innerHTML = items.map(e => {
    const isUnread = e.unread && !readIds.has(e.id);
    const isActive = e.id === selectedId;
    const badgeHtml = `<span class="text-[9px] px-1.5 py-0.5 rounded border badge-${e.badge} mono">${e.badgeText}</span>`;
    return `<div class="mail-item p-3 ${isUnread?'unread':''} ${isActive?'active':''}" onclick="openEmail('${e.id}')">
      <div class="flex items-start gap-2">
        ${isUnread && !readIds.has(e.id) ? '<span class="unread-dot mt-1.5 shrink-0"></span>' : '<span class="w-1.5 shrink-0"></span>'}
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-1 mb-0.5">
            <p class="text-xs ${isUnread&&!readIds.has(e.id)?'text-white font-semibold':'text-[#94A3B8]'} truncate">${esc(fromShort(e.from))}</p>
            <p class="text-[10px] text-[#475569] shrink-0">${esc(e.date)}</p>
          </div>
          <p class="mail-subject text-xs truncate mb-1.5">${esc(e.subject)}</p>
          ${badgeHtml}
        </div>
      </div>
    </div>`;
  }).join('');
}

function fromShort(from) {
  const m = from.match(/^([^<]+)</);
  return m ? m[1].trim() : from;
}

/* ── OPEN EMAIL ──────────────────────────────────────────────── */
function openEmail(id) {
  const e = EMAILS.find(x => x.id === id);
  if (!e) return;
  selectedId = id;
  markRead(id);
  renderList();

  document.getElementById('r-subject').textContent = e.subject;
  document.getElementById('r-from').textContent    = e.from;
  document.getElementById('r-to').textContent      = e.to;
  document.getElementById('r-date').textContent    = formatDate(e.date);
  document.getElementById('r-body').innerHTML      = e.body;

  const badge = document.getElementById('r-badge');
  badge.textContent = e.badgeText;
  badge.className   = `text-[10px] px-2 py-0.5 rounded border font-bold mono shrink-0 mt-0.5 badge-${e.badge}`;

  const tagsEl = document.getElementById('r-tags');
  tagsEl.innerHTML = (e.tags||[]).map(t =>
    `<span class="text-[9px] px-2 py-0.5 rounded bg-[#1E293B] border border-[#334155] text-[#475569]">${esc(t)}</span>`
  ).join('');
  if (e.flagged) tagsEl.innerHTML += `<span class="text-[9px] px-2 py-0.5 rounded bg-amber-900/20 border border-amber-700/30 text-amber-400">⚑ flagged</span>`;

  document.getElementById('reading-empty').style.display = 'none';
  const pane = document.getElementById('reading-pane');
  pane.style.display = 'flex';
  pane.classList.remove('fade-in');
  void pane.offsetWidth;
  pane.classList.add('fade-in');

  updateInboxCount();
}

/* ── COUNTS ──────────────────────────────────────────────────── */
function updateInboxCount() {
  const unread = EMAILS.filter(e =>
    currentUser && currentUser.level >= e.minLevel &&
    e.folder === 'inbox' && e.unread && !readIds.has(e.id)
  ).length;
  const el = document.getElementById('inbox-count');
  el.textContent = unread;
  el.style.display = unread > 0 ? '' : 'none';
}

/* ── UTIL ────────────────────────────────────────────────────── */
function formatDate(d) {
  try { return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }
  catch(_) { return d; }
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ── INIT ─────────────────────────────────────────────────────── */
updateInboxCount();
renderList();
fetch('/api/access-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'Internal Mail System'})}).catch(()=>{});
</script>
